services:
  postgres:
    image: postgres:16
    container_name: trocae-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trocae
    ports:
      - "5432:5432"
    volumes:
      - trocae_postgres_data:/var/lib/postgresql/data

volumes:
  trocae_postgres_data:
